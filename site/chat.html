<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content, maximum-scale=1">
<meta name="theme-color" content="#07080b">
<title>CEASER AI · Chat</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="chat.css?v=10">
</head>
<body>
<div id="boot" aria-label="Loading CEASER AI">
  <div class="bt-aurora"></div><div class="bt-grid"></div>
  <div class="bt-core"><i class="bt-ring r1"></i><i class="bt-ring r2"></i><i class="bt-ring r3"></i><div class="bt-logo"><span>C</span></div></div>
  <div class="bt-word" aria-hidden="true"><i>C</i><i>E</i><i>A</i><i>S</i><i>E</i><i>R</i><i class="sp"></i><i class="ai">A</i><i class="ai">I</i></div>
  <div class="bt-meta"><span id="btt">Waking the engine…</span><b id="btp">6%</b></div>
  <div class="bt-bar"><i id="btf"></i></div>
</div>
<div class="shell" id="shell">
  <aside class="drawer" id="drawer" aria-label="Menu"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="col">
    <header class="top">
      <button class="ib" id="mb" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <div class="ttl" id="ttl"><i class="mk">C</i><span class="wm">CEASER <b>AI</b></span></div>
      <div class="tray" id="tray">
        <div class="trayBody" id="trayBody">
          <div class="live wait" id="live" title="Server status"><b></b><span>Connecting…</span></div>
          <button class="tbtn" id="nc" aria-label="New chat" title="New chat"><svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
          <button class="tbtn" id="dots" aria-label="More" title="More"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></button>
        </div>
        <button class="ib tiny" id="hdrTrigger" aria-label="Quick actions" aria-haspopup="true"><i class="hdrDot" id="hdrDot"></i><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
      </div>
    </header>
    <main id="main"></main>
  </div>
</div>
<div id="pop" class="pop" hidden></div>
<div id="tmenu" class="pop tmenu" hidden></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" role="status"></div>
<script src="chat.js?v=10"></script>
</body>
</html>
