<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<meta name="description" content="CEASER AI: chat, code and build with a fast streaming AI assistant.">
<title>CEASER AI</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="assets/ceaser-boot.css">
</head>
<body>
<div id="boot-screen" aria-label="Loading CEASER AI">
  <div class="bt-aurora"></div><div class="bt-grid"></div>
  <div class="bt-core">
    <div class="bt-ring r1"></div><div class="bt-ring r2"></div><div class="bt-ring r3"></div>
    <div class="bt-logo"><span>C</span></div>
  </div>
  <div class="bt-word" aria-hidden="true"><i>C</i><i>E</i><i>A</i><i>S</i><i>E</i><i>R</i><i class="sp"></i><i class="ai">A</i><i class="ai">I</i></div>
  <div class="bt-tag">THINK · CREATE · BUILD · SHIP</div>
  <div class="bt-steps"><span>Waking the engine…</span><span>Securing your session…</span><span>Tuning the model…</span><span>Almost there…</span></div>
  <div class="boot-track"><i></i></div>
  <div class="boot-status"><span>INITIALIZING</span><b id="boot-progress">0%</b></div>
</div>
<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
