<!doctype html>
<html lang="en">
<head>
<style>html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}button,a,.btn{-webkit-user-select:none;user-select:none}</style>
<script>document.documentElement.classList.add("page-scroll")</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a2377">
<meta name="description" content="CEASER AI: chat, code and build with a fast streaming AI assistant.">
<title>CEASER AI</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="assets/ceaser-ui.css">
<link rel="stylesheet" href="assets/ceaser-motion.css?v=15">
<link rel="stylesheet" href="assets/ceaser-account.css?v=4">
</head>
<body>
<div id="boot-screen" aria-label="Loading CEASER AI">
  <div class="bt-aurora"></div><div class="bt-grid"></div>
  <div class="bt-stage"><div class="bt-pulse"></div><div class="bt-orbit"><div class="bt-tile" style="--i:0;--rx:-110px;--cx:0px;--cy:-62px"><b>C</b></div><div class="bt-tile" style="--i:1;--rx:-66px;--cx:54px;--cy:-31px"><b>E</b></div><div class="bt-tile" style="--i:2;--rx:-22px;--cx:54px;--cy:31px"><b>A</b></div><div class="bt-tile" style="--i:3;--rx:22px;--cx:0px;--cy:62px"><b>S</b></div><div class="bt-tile" style="--i:4;--rx:66px;--cx:-54px;--cy:31px"><b>E</b></div><div class="bt-tile" style="--i:5;--rx:110px;--cx:-54px;--cy:-31px"><b>R</b></div></div><div class="bt-dot"></div></div>
  <div class="bt-word" aria-hidden="true"><i>C</i><i>E</i><i>A</i><i>S</i><i>E</i><i>R</i><i class="sp"></i><i class="ai">A</i><i class="ai">I</i></div>
  <div class="bt-tag">THINK · CREATE · BUILD · SHIP</div>
  <div class="bt-steps"><span id="btt">Waking the engine…</span></div>
  <div class="boot-track"><i></i></div>
  <div class="boot-status"><span>INITIALIZING</span><b id="btp">0%</b></div>
</div>
<div id="app"></div>
<script src="app-feel.js?v=1"></script>
<script src="app.js?v=6"></script>
</body>
</html>
