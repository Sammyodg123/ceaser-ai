<style>
  .index-fallback{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:96px 22px 48px;text-align:center;background:radial-gradient(circle at 20% 10%,rgba(139,123,255,.24),transparent 35%),radial-gradient(circle at 85% 30%,rgba(25,195,255,.18),transparent 34%),#070b1a;color:#eef2ff}
  .index-fallback__inner{width:min(100%,680px)}
  .index-fallback__eyebrow{display:inline-flex;gap:9px;align-items:center;border:1px solid rgba(73,245,177,.38);border-radius:999px;padding:8px 13px;color:#bfffe7;font:700 11px/1.2 Inter,system-ui;letter-spacing:.14em;text-transform:uppercase}
  .index-fallback__eyebrow i{width:8px;height:8px;border-radius:50%;background:#49f5b1;box-shadow:0 0 18px #49f5b1;animation:indexPulse 1.2s infinite}
  .index-fallback h1{margin:22px 0 14px;font:800 clamp(42px,10vw,78px)/.98 Inter,system-ui;letter-spacing:-.05em}
  .index-fallback h1 b{font-weight:800;background:linear-gradient(100deg,#49f5b1,#38bdf8,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:180% 100%;animation:indexGradient 7s ease-in-out infinite}
  .index-fallback p{max-width:560px;margin:0 auto;color:rgba(226,234,255,.72);font:400 17px/1.6 Inter,system-ui}
  .index-fallback__signal{display:flex;justify-content:center;gap:8px;margin:30px auto 0;flex-wrap:wrap}
  .index-fallback__signal span{border:1px solid rgba(190,211,255,.18);border-radius:12px;padding:10px 13px;background:rgba(255,255,255,.055);color:#dce8ff;font:600 13px Inter,system-ui;animation:indexFloat 4s ease-in-out infinite}
  .index-fallback__signal span:nth-child(2){animation-delay:-1.2s}.index-fallback__signal span:nth-child(3){animation-delay:-2.4s}
  @keyframes indexPulse{50%{opacity:.35;transform:scale(.72)}}
  @keyframes indexGradient{50%{background-position:100% 0}}
  @keyframes indexFloat{50%{transform:translateY(-5px);border-color:rgba(73,245,177,.45)}}
  @media(prefers-reduced-motion:reduce){.index-fallback *{animation:none!important}}
</style>
<link rel="stylesheet" href="assets/ceaser-header.css?v=21.5">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1456980829304780" crossorigin="anonymous"></script>
</head>
<body>
<div id="boot-screen" aria-label="Loading CEASER AI">
  <div class="bt-aurora"></div><div class="bt-grid"></div>
  <div class="bt-stage"><div class="bt-pulse"></div><div class="bt-orbit"><div class="bt-tile" style="--i:0;--rx:-110px;--cx:0px;--cy:-62px"><b>C</b></div><div class="bt-tile" style="--i:1;--rx:-66px;--cx:54px;--cy:-31px"><b>E</b></div><div class="bt-tile" style="--i:2;--rx:-22px;--cx:54px;--cy:31px"><b>A</b></div><div class="bt-tile" style="--i:3;--rx:22px;--cx:0px;--cy:62px"><b>S</b></div><div class="bt-tile" style="--i:4;--rx:66px;--cx:-54px;--cy:31px"><b>E</b></div><div class="bt-tile" style="--i:5;--rx:110px;--cx:-54px;--cy:-31px"><b>R</b></div></div><div class="bt-dot"></div></div>
  <div class="bt-word" aria-hidden="true"><i>C</i><i>E</i><i>A</i><i>S</i><i>E</i><i>R</i><i class="sp"></i><i class="ai">A</i><i class="ai">I</i></div>
  <div class="bt-tag">THINK · CREATE · BUILD · SHIP</div>
  <div class="bt-steps"><span id="btt">Waking the engine…</span></div>
  <div class="boot-track"><i></i></div>
  <div class="boot-status"><span>INITIALIZING</span><b id="btp">0%</b></div>
</div>
<div id="app">
  <main class="index-fallback" aria-label="CEASER AI loading">
    <div class="index-fallback__inner">
      <div class="index-fallback__eyebrow"><i></i> CEASER AI · LIVE WORKSPACE</div>
      <h1>Your AI for<br>learning<br><b>built to ship.</b></h1>
      <p>Chat, write, debug and build with an assistant that streams answers instantly.</p>
      <div class="index-fallback__signal"><span>Claude · ready</span><span>Gemini · ready</span><span>Live replies · on</span></div>
    </div>
  </main>
</div>
<script src="app-feel.js?v=21.0"></script>

<script src="app.js?v=21.1"></script>

</body>
</html>
